version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn src.server:app --host 0.0.0.0 --port 8000
    env_file:
      - .env

  frontend:
    build: .
    ports:
      - "8501:8501"
    command: streamlit run src/app.py --server.address 0.0.0.0
    environment:
      - BACKEND_URL=http://backend:8000/chat
    depends_on:
      - backend